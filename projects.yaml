# Deterministic checks used by CODECTORY quality phases.
# Project paths are relative to the repository root. Each command is an argv
# array (never a shell string) and runs with its project's path as cwd.
projects:
  adws:
    path: adws
    guides: guides/adws
    checks:
      - name: python-compile
        area: backend
        operation: build
        command: [python, -m, compileall, -q, .]
        timeout_seconds: 120
  web:
    path: web
    guides: guides/web
    checks:
      - name: format
        area: fullstack
        operation: format
        command: [bun, run, format:check]
        timeout_seconds: 120
      - name: lint
        area: fullstack
        operation: lint
        command: [bun, run, lint]
        timeout_seconds: 120
      - name: typecheck
        area: fullstack
        operation: typecheck
        command: [bun, run, typecheck]
        timeout_seconds: 120
      - name: test
        area: fullstack
        operation: test
        command: [bun, run, test]
        timeout_seconds: 300
      - name: build
        area: fullstack
        operation: build
        command: [bun, run, build]
        timeout_seconds: 300

agents:
- name: research
  display_name: Orion
  model: openrouter/~google/gemini-flash-latest
  thinking: medium
  color: '#34d399'
  purpose: Look up current authoritative documentation through the Context7 CLI for
    the planner.
  prompt_engineering:
    system: adws/adw_data/prompt_engineering/research/system.md
    user: adws/adw_data/prompt_engineering/research/user.md
  writes: []
  tools:
  - read
  - grep
  - find
  - ls
  - bash
  - write
- name: planner
  display_name: Atlas
  model: openai-codex/gpt-5.6-sol
  thinking: medium
  color: '#a78bfa'
  purpose: Turn a request into a plan the builder can implement without asking questions.
  prompt_engineering:
    system: adws/adw_data/prompt_engineering/planner/system.md
    user: adws/adw_data/prompt_engineering/planner/user.md
  writes:
  - specs/
  tools:
  - read
  - grep
  - find
  - ls
  - bash
  - write
- name: builder
  display_name: Artemis
  model: openai-codex/gpt-5.6-luna
  color: '#22d3ee'
  purpose: Implement the plan exactly; report every changed file in the envelope.
  prompt_engineering:
    system: adws/adw_data/prompt_engineering/builder/system.md
    user: adws/adw_data/prompt_engineering/builder/user.md
  tools:
  - read
  - grep
  - find
  - ls
  - bash
  - edit
  - write
- name: scout
  display_name: Apollo
  model: openrouter/~anthropic/claude-haiku-latest
  color: '#fbbf24'
  purpose: Find and report where things live; change nothing.
  prompt_engineering:
    system: adws/adw_data/prompt_engineering/scout/system.md
    user: adws/adw_data/prompt_engineering/scout/user.md
  writes: []
  tools:
  - read
  - grep
  - find
  - ls
  - bash
  - write
- name: reviewer
  display_name: Thanatos
  model: openrouter/google/gemini-3.6-flash
  thinking: medium
  color: '#fb7185'
  purpose: Confirm that what was built is what was asked for; change nothing.
  prompt_engineering:
    system: adws/adw_data/prompt_engineering/reviewer/system.md
    user: adws/adw_data/prompt_engineering/reviewer/user.md
  writes: []
  tools:
  - read
  - grep
  - find
  - ls
  - bash
  - write
- name: documenter
  display_name: Apex
  model: openai-codex/gpt-5.6-luna
  color: '#e879f9'
  purpose: Write up the change that was just made, from the diff; document only.
  prompt_engineering:
    system: adws/adw_data/prompt_engineering/documenter/system.md
    user: adws/adw_data/prompt_engineering/documenter/user.md
  writes:
  - app_docs/
  - docs/
  - '**/*.md'
  - '*.md'
  tools:
  - read
  - grep
  - find
  - ls
  - bash
  - write
  - edit

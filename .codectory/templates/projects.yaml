# Deterministic checks used by CODECTORY quality phases.
# Project paths are relative to the repository root. Each command is an argv
# array (never a shell string) and runs with its project's path as cwd.
# A project may optionally set `guides` to a directory of Markdown guidance.
projects:
  adws:
    path: adws
    checks:
      - name: python-compile
        area: backend
        operation: build
        command: [python, -m, compileall, -q, .]
        timeout_seconds: 120

